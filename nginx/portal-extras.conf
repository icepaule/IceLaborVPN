# =============================================================
# IceLaborVPN Portal - LAN Services (added 2026-05-01)
# Alle proxy_pass via Tailscale-Routes (synnas Subnet-Router)
# Alle locations protected via auth_request /auth/verify
# =============================================================

# Generic helper: rewrite absolute paths in HTML/JS to subpath
# (Wird per location separat aufgerufen wo nötig)

# ----------------------------- SMART HOME -----------------------------

location /ha/ {
    auth_request /auth/verify;
    error_page 401 = @auth_redirect;
    proxy_pass http://192.168.178.108:8123/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_buffering off;
    proxy_read_timeout 3600;
    client_max_body_size 100M;
}

