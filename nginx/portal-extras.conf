# ----------------------------- NETWORK & MGMT -----------------------------

location /adguard/ {
    auth_request /auth/verify;
    error_page 401 = @auth_redirect;
    proxy_pass http://192.168.178.145/;
    proxy_http_version 1.1;
    proxy_set_header Host 192.168.178.145;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_buffering off;
    sub_filter_once off;
    sub_filter_types application/javascript text/css;
    sub_filter 'href="/' 'href="/adguard/';
    sub_filter 'src="/' 'src="/adguard/';
    sub_filter 'action="/' 'action="/adguard/';
}

