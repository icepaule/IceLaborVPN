# =============================================================
# IceLaborVPN - Subdomain Reverse-Proxies (added 2026-05-03)
# DNS: alle Subdomains zeigen direkt auf 46.4.142.238 (umgeht Sophos WSP)
# Cert: pro Subdomain via Letsencrypt HTTP-01 (siehe certbot)
# Auth-Gate: shared via Cookie Domain=.thesoc.de
# =============================================================

# ----- Internal auth_request endpoint (shared by alle Subdomains) -----
# (definiert pro server-block, weil jedes server eigene location-table hat)

# ----- HTTP -> HTTPS redirect für alle Subdomains -----
server {
    listen 80;
    server_name solidtime.thesoc.de homarr.thesoc.de nextcloud.thesoc.de
                openwebui.thesoc.de xwiki-bridge.thesoc.de;

    # Letsencrypt webroot
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ===== Solidtime =====
server {
    listen 443 ssl http2;
    server_name solidtime.thesoc.de;

    ssl_certificate     /etc/letsencrypt/live/solidtime.thesoc.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/solidtime.thesoc.de/privkey.pem;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    # Auth verify endpoint (intern → auth-gate)
    location = /auth/verify {
        internal;
        proxy_pass http://127.0.0.1:8089/auth/verify;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $host;
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header X-Original-Host $host;
        proxy_set_header Cookie $http_cookie;
    }

    location @auth_redirect {
        return 302 https://portal.thesoc.de/auth/login?redirect=https://$host$request_uri;
    }

    location / {
        auth_request /auth/verify;
        error_page 401 = @auth_redirect;

        proxy_pass http://100.64.0.3:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 3600;
        client_max_body_size 100M;
    }
}

