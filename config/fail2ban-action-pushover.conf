# Fail2ban Action: Pushover Notification
# /etc/fail2ban/action.d/pushover-notify.conf

[Definition]

actionstart =

actionstop =

actioncheck =

actionban = /opt/IceLaborVPN/scripts/pushover-notify.sh --type ban --ip <ip> --jail <name> --reason "<reason>" --duration <bantime>

actionunban = /opt/IceLaborVPN/scripts/pushover-notify.sh --type unban --ip <ip> --jail <name>

[Init]

reason = Multiple failed authentication attempts
