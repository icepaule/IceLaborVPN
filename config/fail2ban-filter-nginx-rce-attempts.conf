# Fail2Ban filter for Remote Code Execution / Shell injection attempts
# Catches shell commands, JNDI/Log4Shell, cgi-bin, SDK exploits, scanner signatures

[Definition]

failregex = ^<HOST> \- \S+ \[\] \"(GET|POST|HEAD|PUT) \S*(/cgi-bin/|/shell|/cmd|whoami|/bin/sh|/bin/bash|SDK/webLanguage|\$\{jndi|%%24%%7bjndi|%%24%%7Bjndi)\S* \S+\" \d+ \d+ \"[^\"]*\" \".*\"$
            ^<HOST> \- \S+ \[\] \"[^\"]*\" \d+ \d+ \"[^\"]*\" \".*(nikto|sqlmap|nmap|masscan|acunetix|dirbuster|gobuster|wfuzz|nuclei|zgrab).*\"$

ignoreregex =
