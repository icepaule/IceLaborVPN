# Fail2Ban filter for directory traversal attacks
# Catches ../, %2e%2e, %252e encoded traversal and sensitive file access

[Definition]

failregex = ^<HOST> \- \S+ \[\] \"(GET|POST|HEAD|PUT|DELETE) \S*(\.\./|%%2e%%2e|%%252e|%%2f\.\.|/etc/passwd|/etc/shadow|/proc/self|/windows/win\.ini)\S* \S+\" \d+ \d+ \"[^\"]*\" \".*\"$

ignoreregex =
