# Fail2Ban filter for sensitive file probes
# Catches access to .env, .git, credentials, config backups, Dockerfiles etc.

[Definition]

failregex = ^<HOST> \- \S+ \[\] \"(GET|POST|HEAD) \S*(\.env|\.git/|\.gitlab|\.svn/|\.hg/|\.htpasswd|\.htaccess|web\.config|Dockerfile|docker-compose|credentials|wp-config|\.aws/|\.ssh/|id_rsa|\.npmrc|\.DS_Store|composer\.json|package\.json\.bak|\.sql|\.bak|\.backup)\S* \S+\" \d+ \d+ \"[^\"]*\" \".*\"$

ignoreregex =
